<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mahaul-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="50%" stop-color="#e9a154" />
      <stop offset="100%" stop-color="#9d0208" />
    </linearGradient>
    <linearGradient id="steam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="url(#mahaul-grad)" />
  
  <!-- Inner Glow Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Steaming Chai Glass / Cup -->
  <g filter="url(#glow)">
    <!-- Steam Lines -->
    <path d="M26 18 C24 14, 28 12, 26 8" fill="none" stroke="url(#steam-grad)" stroke-width="2" stroke-linecap="round" />
    <path d="M32 17 C30 13, 34 11, 32 6" fill="none" stroke="url(#steam-grad)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M38 18 C36 14, 40 12, 38 8" fill="none" stroke="url(#steam-grad)" stroke-width="2" stroke-linecap="round" />

    <!-- Cutting Chai Glass Body -->
    <path d="M21 24 L25 50 C25.5 52.5 27.5 54 30 54 L34 54 C36.5 54 38.5 52.5 39 50 L43 24 Z" fill="#ffffff" />
    
    <!-- Chai Liquid Fill -->
    <path d="M23.2 30 L26.2 49 C26.5 50.5 27.8 51.5 29.5 51.5 L34.5 51.5 C36.2 51.5 37.5 50.5 37.8 49 L40.8 30 Z" fill="#c85a17" opacity="0.9" />

    <!-- Glass Rim & Bands -->
    <line x1="20" y1="24" x2="44" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="23.5" y1="36" x2="40.5" y2="36" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Soundwave Ambient Dots -->
    <circle cx="14" cy="38" r="2" fill="#ffffff" opacity="0.85" />
    <circle cx="50" cy="38" r="2" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
